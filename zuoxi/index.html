<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17150F" media="(prefers-color-scheme: dark)" />
    <title>作息 · 日程与久坐提醒</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C4663C'/%3E%3Crect x='8' y='9' width='3' height='14' rx='1.5' fill='%23FAF7F2'/%3E%3Crect x='14' y='9' width='3' height='9' rx='1.5' fill='%23FAF7F2'/%3E%3Crect x='20' y='9' width='3' height='5' rx='1.5' fill='%23FAF7F2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">作息</span>
      </div>
      <div class="month-nav">
        <button type="button" id="prevMonth" class="icon-btn" aria-label="上个月">‹</button>
        <h1 id="monthTitle">—</h1>
        <button type="button" id="nextMonth" class="icon-btn" aria-label="下个月">›</button>
        <button type="button" id="todayBtn" class="ghost-btn">今天</button>
      </div>
      <div class="topbar-right">
        <button type="button" id="openSettings" class="icon-btn" aria-label="设置">⚙</button>
      </div>
    </header>

    <main class="layout">
      <section class="calendar-pane">
        <div class="weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <aside class="side-pane">
        <section class="card" id="sittingCard"></section>
        <section class="card" id="dayCard"></section>
        <section id="notesCard"></section>
      </aside>    </main>

    <div id="uiLayer" class="ui-layer"></div>

    <div id="reminderOverlay" class="reminder-overlay" aria-hidden="true">
      <div class="reminder-panel">
        <p class="reminder-eyebrow">休息提醒</p>
        <h2 id="reminderText">你已经连续坐了 45 分钟</h2>
        <div class="reminder-actions">
          <button type="button" id="reminderRest" class="primary-btn">去休息</button>
          <button type="button" id="reminderSnooze" class="ghost-btn">20 分钟后再提醒</button>
        </div>
      </div>
    </div>

    <div id="restOverlay" class="rest-overlay" aria-hidden="true">
      <div class="rest-panel">
        <p class="rest-label">已休息</p>
        <div class="rest-timer" id="restTimer">00:00:00</div>
        <button type="button" id="restBack" class="primary-btn">开始工作</button>
      </div>
    </div>

    <aside id="settingsDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <h2>设置</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
      </div>
      <div class="drawer-body"></div>
    </aside>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
